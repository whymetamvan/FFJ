name: Scrape FF Wiki

on:
  workflow_dispatch:

permissions:
  contents: write        # ← wajib untuk push

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # supaya bisa push balik

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scrape.py

      - name: Commit & push result
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # hanya add file yang ada (hindari error kalau file tidak dibuat)
          [ -f all_skins.json ] && git add all_skins.json || true
          [ -f progress.json  ] && git add progress.json  || true

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, skip commit."
          else
            git commit -m "chore: update all_skins.json [skip ci]"
            git push
          fi
